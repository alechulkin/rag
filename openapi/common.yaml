openapi: 3.1.0
info:
  title: AI Knowledge Assistant API Common Components
  version: 1.0.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    X-Request-Id:
      description: Correlation ID propagated end-to-end.
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Optional idempotency key for retry-sensitive writes.
      required: false
      schema:
        type: string
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        requestId:
          type: string
    CursorPage:
      type: object
      properties:
        nextCursor:
          type: [string, 'null']
    ErrorResponse:
      $ref: '#/components/schemas/ProblemDetails'
