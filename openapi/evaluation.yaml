openapi: 3.1.0
info:
  title: Evaluation API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Evaluation
paths:
  /workspaces/{workspaceId}/eval/suites/{suiteId}/runs:
    post:
      tags: [Evaluation]
      summary: Start an evaluation run (async)
      operationId: startEvaluationRun
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
        - name: suiteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Accepted
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId: { type: string }
                  status: { type: string }
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/X-Request-Id'
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
