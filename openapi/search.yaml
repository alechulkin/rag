openapi: 3.1.0
info:
  title: Search API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Search
    description: Permission-aware hybrid search.
paths:
  /workspaces/{workspaceId}/search:
    post:
      tags: [Search]
      summary: Permission-aware search (hybrid)
      operationId: search
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                scope:
                  type: object
                  description: Optional scope narrowing (collections/documents).
                  properties:
                    collectionIds:
                      type: array
                      items: { type: string }
                    documentIds:
                      type: array
                      items: { type: string }
                cursor:
                  type: [string, 'null']
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 20
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [documentId, chunkId, score]
                      properties:
                        documentId: { type: string }
                        chunkId: { type: string }
                        score: { type: number }
                        snippet: { type: string }
                  nextCursor:
                    type: [string, 'null']
        '400':
          description: Bad request
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/X-Request-Id'
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
