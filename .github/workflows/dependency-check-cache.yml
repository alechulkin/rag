name: dependency-check-cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: dependency-check-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Restore prior Dependency-Check data
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-12.2.2-

      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Add NVD_API_KEY as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Refresh Dependency-Check data
        run: ./gradlew dependencyCheckUpdate --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Snapshot Dependency-Check data (stable for caching)
        run: |
          set -euo pipefail
          snap=/tmp/dependency-check-data-snapshot
          mkdir -p "$snap"
          rsync -a --delete ~/.gradle/dependency-check-data/ "$snap"/
          rsync -a --delete ~/.gradle/dependency-check-data/ "$snap"/

      - name: Save refreshed Dependency-Check data
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/dependency-check-data-snapshot
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}
