# CI — the loop nobody can skip.
# Mirrors the local verification gates deterministically: if it isn't green
# here, it isn't done, regardless of what any agent or human claims.
#
# Repo is documentation-first (no build files yet). Active gates cover the
# docs/contract surface per the rag-change-workflow skill + NFR §7.3 (secret
# scanning) + docs/qa/verification-manifest.json. backend-verify is active
# from foundation-slice task 2.2; frontend-verify stays commented until task 2.7.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history for secret scanning

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # --- static, fast, deterministic ---

      - name: Verification manifest shape
        run: node scripts/check-verification-manifest.mjs

      - name: OpenAPI lint (3.1-aware; errors block, warnings reported)
        run: npx --yes @redocly/cli@2.44.1 lint openapi/*.yaml --extends=minimal

      - name: OpenSpec strict validation
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict

      - name: Relative markdown links resolve
        run: node scripts/check-doc-links.mjs

      - name: Traceability report committed and fresh
        run: node scripts/check-traceability.mjs --check-fresh

      - name: Golden seed schema validation
        run: node scripts/check-golden-seed.mjs

      - name: Slice G4 evidence gates (when evidence exists)
        run: node scripts/check-slice-gates.mjs

      - name: Mermaid diagrams render
        run: |
          echo '{"args":["--no-sandbox","--disable-gpu"],"executablePath":"/usr/bin/google-chrome"}' > /tmp/puppeteer-ci.json
          mkdir -p /tmp/mmd-out
          found=0
          result=0
          while IFS= read -r -d '' f; do
            found=1
            echo "rendering: $f"
            npx --yes @mermaid-js/mermaid-cli@11.16.0 -p /tmp/puppeteer-ci.json \
              -i "$f" -o "/tmp/mmd-out/$(basename "$f")" || result=1
          done < <(grep -rlZ '```mermaid' --include='*.md' docs *.md 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then echo "no mermaid blocks found"; exit 0; fi
          exit "$result"

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org repos need GITLEAKS_LICENSE; personal repos run free.

      - name: Upload docs-verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-verify-evidence
          path: |
            docs/qa/traceability-report.md
            docs/qa/verification-manifest.json
            openspec/changes/*/evidence/
            openspec/changes/archive/*/evidence/
          if-no-files-found: ignore

  dependency-check-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Restore Dependency-Check data
        id: dependency-check-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-12.2.2-

      # cache-hit is only true on an exact key match. restore-keys hits set
      # cache-matched-key instead. Empty matched key = cold cache: warm + save.
      - name: Require NVD API key for cold cache
        if: steps.dependency-check-cache.outputs.cache-matched-key == ''
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Add NVD_API_KEY as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Warm missing Dependency-Check data
        if: steps.dependency-check-cache.outputs.cache-matched-key == ''
        run: ./gradlew dependencyCheckUpdate --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Save warmed Dependency-Check data
        if: steps.dependency-check-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}

  backend-verify:
    needs: dependency-check-data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Restore warmed Dependency-Check data
        id: dependency-check-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-12.2.2-

      - name: Require warmed Dependency-Check data
        if: steps.dependency-check-cache.outputs.cache-matched-key == ''
        run: |
          echo "::error::Dependency-Check data cache is missing after the dependency-check-data prerequisite. Inspect its cache-save logs."
          exit 1

      - name: Error Prone (JavaCompile)
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Lint (Checkstyle + SpotBugs)
        run: ./gradlew checkstyleMain checkstyleTest spotbugsMain --no-daemon

      - name: Dependency vulnerability scan (fail on CVSS ≥ 7)
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Unit + integration tests (Testcontainers + ArchUnit when present)
        run: ./gradlew test --no-daemon

      - name: Coverage thresholds (JaCoCo 70% aggregate, 90% policy/audit/search)
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: PR coverage comment
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70

      - name: SBOM (CycloneDX)
        run: ./gradlew cyclonedxBom --no-daemon

      - name: Production build
        run: ./gradlew build --no-daemon

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/checkstyle/
            build/reports/spotbugs/
            build/reports/dependency-check/
            build/reports/sbom.json
          if-no-files-found: ignore

