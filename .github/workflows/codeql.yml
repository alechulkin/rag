# SAST — NFR §7.3 / mvp-capability-plan §6.2
name: codeql

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@3b9adf281a8ea3f42b1ea54793b5a844736ead9d # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0a15660c8881192a8aa018abeab7e0e6e056ad9 # v4

      - uses: github/codeql-action/init@821dbae38e8fa7e3a125ae9d716e0c7f6c5e5e5 # v3
        with:
          languages: java-kotlin

      - name: Compile (Error Prone runs on JavaCompile)
        run: ./gradlew compileJava compileTestJava --no-daemon

      - uses: github/codeql-action/analyze@821dbae38e8fa7e3a125ae9d716e0c7f6c5e5e5 # v3
